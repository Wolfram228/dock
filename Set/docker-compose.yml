name: webstack

x-net: &shared_net
  - backend

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: *shared_net

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
    networks: *shared_net

  redis:
    image: redis:alpine
    networks: *shared_net

  php:
    build:
      context: ./web
    volumes:
      - type: bind
        source: ./web
        target: /var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_started
      redis:
        condition: service_started
    networks: *shared_net

  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: "8080"
        protocol: tcp
    volumes:
      - type: bind
        source: ./nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./web
        target: /var/www/html
        read_only: true
    depends_on:
      - php
    networks: *shared_net

networks:
  backend:
    driver: bridge